<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mi Hermana 💖</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: 1s;
  position: relative;
  padding: 20px;
}

body.noche {
  background: linear-gradient(to bottom, #050816, #0d1b3d, #35245f);
}

body.dia {
  background: linear-gradient(to bottom, #87ceeb, #bde0ff, #fff4e6);
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  animation: brillar 2s infinite alternate;
}

@keyframes brillar {
  from { opacity: 0.2; transform: scale(1); }
  to { opacity: 1; transform: scale(1.8); }
}

.moon, .sun {
  position: absolute;
  top: 45px;
  right: 55px;
  width: 95px;
  height: 95px;
  border-radius: 50%;
}

.moon {
  background: #f5f3ce;
  box-shadow: 0 0 40px #fff8b0;
}

.moon::after {
  content: '';
  position: absolute;
  top: -5px;
  left: 23px;
  width: 95px;
  height: 95px;
  background: #0d1b3d;
  border-radius: 50%;
}

.sun {
  background: #ffd93d;
  box-shadow: 0 0 60px #ffe066;
}

.card {
  width: 100%;
  max-width: 400px;
  padding: 35px 28px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 25px;
  text-align: center;
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: white;
  box-shadow: 0 0 30px rgba(255,255,255,0.12);
  animation: subir 1.5s ease;
  z-index: 10;
}

body.dia .card {
  color: #263568;
}

h1 {
  font-size: clamp(27px, 7vw, 35px);
  margin-bottom: 20px;
}

p {
  font-size: 17px;
  line-height: 1.8;
}

.heart {
  color: #ff5c8a;
  display: inline-block;
  animation: latido 1s infinite;
}

button {
  margin-top: 25px;
  padding: 13px 27px;
  border: none;
  border-radius: 30px;
  background: white;
  color: #6241a5;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 5px 15px rgba(0,0,0,0.12);
}

button:hover {
  transform: scale(1.06);
}

#sorpresa {
  display: none;
  margin-top: 20px;
  animation: subir 0.8s ease;
}

@keyframes latido {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

@keyframes subir {
  from { opacity: 0; transform: translateY(35px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .moon, .sun {
    width: 65px;
    height: 65px;
    top: 25px;
    right: 25px;
  }

  .moon::after {
    width: 65px;
    height: 65px;
    left: 17px;
    top: -3px;
  }

  .card {
    padding: 30px 22px;
  }

  p {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div id="astro"></div>

<div class="card">
  <h1 id="titulo"></h1>

  <p id="mensajeTexto"></p>

  <button onclick="mensaje()">
    Una sorpresita para ti ✨
  </button>

  <div id="sorpresa">
    <p>
      Que nunca te falten motivos para sonreír,
      fuerzas para seguir adelante y personas
      que te recuerden lo valiosa que eres.
      <br><br>
      ¡Te quiero mucho, hermanita! 💖
      <br>
      <span class="heart">♥ ♥ ♥</span>
    </p>
  </div>
</div>

<script>
const hora = new Date().getHours();

const body = document.body;
const astro = document.getElementById("astro");
const titulo = document.getElementById("titulo");
const mensajeTexto = document.getElementById("mensajeTexto");
const sorpresa = document.getElementById("sorpresa");

if (hora >= 6 && hora < 18) {
  body.classList.add("dia");
  astro.innerHTML = '<div class="sun"></div>';

  titulo.innerHTML = '¡Feliz inicio de semana! ☀️';

  mensajeTexto.innerHTML = `
    Buenos días, hermanita hermosa. 💖<br><br>

    Deseo de todo corazón que esta nueva semana
    llegue cargada de bendiciones, salud,
    alegría y muchas oportunidades bonitas
    para tu vida. ✨<br><br>

    Que cada día tengas nuevas razones para
    sonreír y la fuerza necesaria para cumplir
    todo lo que te propongas. Nunca olvides
    lo especial y valiosa que eres. 🌷
  `;

} else {
  body.classList.add("noche");
  astro.innerHTML = '<div class="moon"></div>';

  titulo.innerHTML = 'Una nueva semana 🌙';

  mensajeTexto.innerHTML = `
    Hermanita, que esta nueva semana que comienza
    esté llena de paz, bendiciones y nuevas
    oportunidades para ti. 💖<br><br>

    Que Dios cuide tus pasos, ilumine tus decisiones
    y te regale motivos para sonreír cada día.
    Descansa con el corazón tranquilo,
    porque vienen nuevas oportunidades. ✨
  `;
}

// Crear estrellas por la noche
if (hora < 6 || hora >= 18) {
  for (let i = 0; i < 80; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.top = Math.random() * 100 + "%";
    star.style.left = Math.random() * 100 + "%";
    star.style.animationDuration =
      (Math.random() * 3 + 1) + "s";

    document.body.appendChild(star);
  }
}

function mensaje() {
  sorpresa.style.display = "block";

  const boton = document.querySelector("button");
  boton.innerHTML = "¡Te quiero, hermanita! 💖";
  boton.disabled = true;

  // Pequeño desplazamiento para mostrar la sorpresa
  sorpresa.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });
}
</script>

</body>
</html>
