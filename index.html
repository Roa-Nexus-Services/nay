<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ✨</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:1s;
  position:relative;
}

/* MODO NOCHE */
body.noche{
  background:linear-gradient(to bottom, #050816, #0d1b3d, #1b2c65);
}

/* MODO DIA */
body.dia{
  background:linear-gradient(to bottom, #87ceeb, #bde0ff, #ffffff);
}

/* ESTRELLAS */
.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:brillar 2s infinite alternate;
}

@keyframes brillar{
  from{
    opacity:0.2;
    transform:scale(1);
  }
  to{
    opacity:1;
    transform:scale(1.8);
  }
}

/* LUNA */
.moon{
  position:absolute;
  top:60px;
  right:80px;
  width:120px;
  height:120px;
  background:#f5f3ce;
  border-radius:50%;
  box-shadow:0 0 40px #fff8b0;
}

.moon::after{
  content:'';
  position:absolute;
  top:10px;
  left:25px;
  width:120px;
  height:120px;
  background:#0d1b3d;
  border-radius:50%;
}

/* SOL */
.sun{
  position:absolute;
  top:60px;
  right:80px;
  width:120px;
  height:120px;
  background:#ffd93d;
  border-radius:50%;
  box-shadow:0 0 60px #ffe066;
}

/* TARJETA */
.card{
  width:360px;
  padding:35px;
  border-radius:25px;
  text-align:center;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);
  color:white;
  box-shadow:0 0 25px rgba(255,255,255,0.15);
  animation:subir 1.5s ease;
  z-index:10;
}

body.dia .card{
  color:#1b2c65;
}

h1{
  font-size:34px;
  margin-bottom:15px;
}

p{
  font-size:18px;
  line-height:1.8;
}

.heart{
  color:#ff5c8a;
  animation:latido 1s infinite;
  display:inline-block;
}

button{
  margin-top:25px;
  padding:12px 28px;
  border:none;
  border-radius:30px;
  background:#ffffff;
  color:#1b2c65;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.08);
}

@keyframes latido{
  0%{transform:scale(1);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

@keyframes subir{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<div id="astro"></div>

<div class="card">

  <h1 id="titulo"></h1>

  <p id="mensajeTexto"></p>

  <button onclick="mensaje()">
    Presióname ✨
  </button>

</div>

<script>

/* DETECTAR HORA */
const hora = new Date().getHours();

const body = document.body;
const astro = document.getElementById("astro");
const titulo = document.getElementById("titulo");
const mensajeTexto = document.getElementById("mensajeTexto");

/* SI ES DE DIA */
if(hora >= 6 && hora < 18){

  body.classList.add("dia");

  astro.innerHTML = `<div class="sun"></div>`;

  titulo.innerHTML = "Buenos días ☀️";

  mensajeTexto.innerHTML = `
    Espero que hoy tengas un día tan bonito
    como tu sonrisa ✨<br><br>

    Me encantó encontrarte y tener la oportunidad
    de coincidir contigo, porque desde que llegaste
    haces mis días mucho más especiales 💖
  `;

}

/* SI ES DE NOCHE */
else{

  body.classList.add("noche");

  astro.innerHTML = `<div class="moon"></div>`;

  titulo.innerHTML = "Buenas noches 🌙";

  mensajeTexto.innerHTML = `
    Mientras las estrellas iluminan el cielo,
    solo quería recordarte que eres una de las
    cosas más bonitas que pasan por mi mente
    antes de dormir ✨<br><br>

    Que la luna cuide tus sueños y descanses
    tan hermoso como tu sonrisa 💖
  `;

  /* CREAR ESTRELLAS */
  for(let i = 0; i < 80; i++){

    let star = document.createElement("div");

    star.className = "star";

    star.style.top = Math.random() * window.innerHeight + "px";

    star.style.left = Math.random() * window.innerWidth + "px";

    star.style.animationDuration =
      (Math.random() * 3 + 1) + "s";

    document.body.appendChild(star);
  }
}

function mensaje(){

  if(hora >= 6 && hora < 18){

    alert("Buenos días Nayibet ☀️✨\n\nEspero que hoy sonrías muchísimo 💖");

  }else{

    alert("Buenas noches Nayibet 🌙✨\n\nSueña bonito... quizás conmigo 💖");

  }
}

</script>

</body>
</html>
```
